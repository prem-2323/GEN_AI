# ==============================================================================
# DocLink / ContentForge AI — Docker Compose Stack
# ==============================================================================
#
# LOCAL LLM (Ollama) & STABLE DIFFUSION FORGE NOTE:
# Ollama and Stable Diffusion Forge are intentionally excluded from Docker.
# Both are optional, GPU-heavy services.
# - If you wish to use local Ollama LLMs, run Ollama natively on your host machine
#   and set OLLAMA_BASE_URL=http://host.docker.internal:11434 in your root .env file.
# - Otherwise, DocLink will automatically use its built-in
#   deterministic fallback engine when Ollama is unavailable.
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # Neo4j Graph Database
  # ----------------------------------------------------------------------------
  neo4j:
    image: neo4j:5
    container_name: doclink-neo4j
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-password}
      - NEO4J_dbms_memory_pagecache_size=512M
      - NEO4J_dbms_memory_heap_initial__size=512M
      - NEO4J_dbms_memory_heap_max__size=1G
    ports:
      - "7474:7474" # Neo4j HTTP Web Console
      - "7687:7687" # Neo4j Bolt protocol
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - doclink-network
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # Backend API Server (FastAPI + Python ML dependencies)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: doclink-backend
    env_file:
      - .env
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password}
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - ./Backend/storage:/app/Backend/storage
      - ./outputs:/app/Backend/outputs
      - ./generated_images:/app/Backend/generated_images
      - ./data:/app/Backend/data
      - hf_cache:/app/Backend/storage/hf_cache
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - doclink-network
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # Frontend Web UI (React + Nginx)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        VITE_BACKEND_URL: http://localhost:8000
    container_name: doclink-frontend
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - doclink-network
    restart: unless-stopped

networks:
  doclink-network:
    driver: bridge

volumes:
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  hf_cache:
    driver: local
